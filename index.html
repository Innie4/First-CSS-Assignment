<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Headphones - Product Page</title>
    <link rel="stylesheet" href="Testing.css">
</head>
<body>
    <div class="product-container">
        <div class="product-card">
            <div class="badge sale-badge">30% OFF</div>
            <div class="badge new-badge">NEW</div>
            
            <div class="product-image-container">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Premium wireless headphones" class="product-image">
                <div class="quick-actions">
                    <button class="action-btn" title="Add to wishlist">♥</button>
                    <button class="action-btn" title="Quick view">👁</button>
                    <button class="action-btn" title="Compare">⚖</button>
                </div>
            </div>
            
            <div class="product-info">
                <span class="brand">AudioPro</span>
                <h2 class="product-title">Premium Wireless Headphones Pro X</h2>
                
                <div class="rating">
                    <span class="stars">★★★★★</span>
                    <span class="rating-count">(248 reviews)</span>
                </div>
                
                <p class="product-description">
                    Experience premium sound quality with active noise cancellation, 
                    40-hour battery life, and ultra-comfortable design perfect for all-day wear.
                </p>
                
                <div class="features">
                    <span class="feature-tag">✓ Noise Cancelling</span>
                    <span class="feature-tag">✓ 40h Battery</span>
                    <span class="feature-tag">✓ Wireless</span>
                    <span class="feature-tag">✓ Premium Sound</span>
                </div>
                
                <div class="color-options">
                    <span class="color-label">Color:</span>
                    <div class="color-swatches">
                        <button class="color-swatch active" style="background-color: #000;" title="Black"></button>
                        <button class="color-swatch" style="background-color: #C0C0C0;" title="Silver"></button>
                        <button class="color-swatch" style="background-color: #FFD700;" title="Gold"></button>
                        <button class="color-swatch" style="background-color: #1E90FF;" title="Blue"></button>
                    </div>
                </div>
                
                
    </div>
</body>
</html>
